services:
  xcf2mealie:
    build: .
    image: ghcr.io/YOURNAME/xcf2mealie:latest
    container_name: xcf2mealie
    restart: unless-stopped
    ports:
      - "9926:9926"
    environment:
      # === 必填：你的 Mealie 地址与 Token ===
      MEALIE_URL: "https://cd.109622.xyz:9443/"
      MEALIE_TOKEN: "eyJhbGciOi...换成你的Token"
      # === 可选：默认追加的标签 ===
      DEFAULT_TAG: "下厨房"
      # === 可选：自定义端口 ===
      PORT: "9926"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9926/', timeout=3)"]
      interval: 60s
      timeout: 5s
      retries: 3
